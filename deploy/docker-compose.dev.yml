# ============================================
# Sub2API 本地开发环境
# 包含 PostgreSQL + Redis + 后端
# ============================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:18-alpine
    container_name: sub2api-dev-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 镜像默认 PGDATA=/var/lib/postgresql/18/docker（pg_ctlcluster 兼容格式），
      # 不再使用 /var/lib/postgresql/data。将宿主机目录挂载到 /var/lib/postgresql 父目录，
      # 让 PG18 按默认子目录 18/docker 初始化，避免启动时报错：
      #   "in 18+, these Docker images are configured to store database data in a format
      #    which is compatible with pg_ctlcluster"
      # 实际数据落盘到宿主机 ./postgres_data/18/docker/。
      - ./postgres_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sub2api}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-localdev123}
      - POSTGRES_DB=${POSTGRES_DB:-sub2api}
      - TZ=${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sub2api}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:8-alpine
    container_name: sub2api-dev-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis_data:/data
    command: redis-server --save 60 1 --appendonly yes
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sub2API 后端（从源码构建）
  sub2api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.dev
    container_name: sub2api-dev-app
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./data:/app/data
      - ../backend/internal/web/dist:/app/frontend-dist:ro
    environment:
      - AUTO_SETUP=true
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - SERVER_MODE=${SERVER_MODE:-debug}
      - RUN_MODE=${RUN_MODE:-standard}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${POSTGRES_USER:-sub2api}
      - DATABASE_PASSWORD=${POSTGRES_PASSWORD:-localdev123}
      - DATABASE_DBNAME=${POSTGRES_DB:-sub2api}
      - DATABASE_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # JWT_SECRET: 后端要求 >= 32 字节（config.go Validate），不要求 hex。
      # 此处默认值为 64 字符的开发用占位串，仅用于本地开发。
      - JWT_SECRET=${JWT_SECRET:-local_dev_jwt_secret_min_32bytes_for_development_only}
      # TOTP_ENCRYPTION_KEY: 后端要求合法 hex 且解码后正好 32 字节（64 hex 字符），
      # 见 aes_encryptor.go NewAESEncryptor。local_dev_totp 含非 hex 字符会导致启动失败。
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@local.dev}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - TZ=${TZ:-Asia/Shanghai}
      - SECURITY_URL_ALLOWLIST_ENABLED=false
      - SECURITY_URL_ALLOWLIST_ALLOW_INSECURE_HTTP=true
      - SECURITY_URL_ALLOWLIST_ALLOW_PRIVATE_HOSTS=true
      # AI 图片生成本地存储（开发环境默认使用 local 驱动）
      - IMAGE_GENERATION_ENABLED=true
      - IMAGE_GENERATION_STORAGE_DRIVER=local
      - IMAGE_GENERATION_LOCAL_STORAGE_PATH=/app/data/media
      - IMAGE_GENERATION_LOCAL_URL_PREFIX=/api/media
      - IMAGE_GENERATION_LOCAL_URL_SIGNING_SECRET=${IMAGE_GENERATION_LOCAL_URL_SIGNING_SECRET:-dev_local_signing_secret_min_32bytes_for_local_dev_only}
      - IMAGE_GENERATION_LOCAL_MIN_FREE_SPACE_MB=512
      - IMAGE_GENERATION_LOCAL_MAX_FILE_SIZE_MB=50
      - IMAGE_GENERATION_PRESIGNED_URL_EXPIRES=1800
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  default:
    name: sub2api-dev
